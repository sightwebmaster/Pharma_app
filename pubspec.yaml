name: pharmaconnect
description: Application pharmaceutique PharmConnect
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Auth Keycloak via navigateur
  flutter_appauth: ^6.0.2
  flutter_secure_storage: ^9.0.0

  # Requêtes HTTP
  dio: ^5.4.0

  # Affichage SVG (logo)
  flutter_svg: ^2.0.9

  # Icônes Material
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
