server:
  port: 8000

spring:
  application:
    name: api-gateway

  # ── CLOUD GATEWAY ─────────────────────────────────────────────────────────
  cloud:
    gateway:

      # CORS global — autorise Flutter Web (Chrome) et Mobile
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://10.0.2.2:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # ── ROUTES Sprint 1 ────────────────────────────────────────────────────
      routes:

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        # ── Sprint 2+ (décommenter quand le service est prêt) ──────────────
        # - id: medication-service
        #   uri: http://localhost:8082
        #   predicates:
        #     - Path=/api/medications/**

        # - id: recommendation-service
        #   uri: http://localhost:8083
        #   predicates:
        #     - Path=/api/recommendations/**

        # - id: notification-service
        #   uri: http://localhost:8084
        #   predicates:
        #     - Path=/api/schedules/**

  # ── SECURITE JWT ──────────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pharma-app

  # ── DÉSACTIVER Redis Sprint 1 ─────────────────────────────────────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# ── ACTUATOR ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ── LOGS ──────────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
